name: Release

# Publishes whatever `packages/a1sheet/package.json` says the version is, on a
# pushed `v*` tag. Runs the same gates as CI first, because a bad publish cannot
# be taken back — npm only allows unpublishing for 72 hours, and the
# version number is burned either way.
#
# Needs an `NPM_TOKEN` repository secret (an npm automation token).
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: the OIDC token is what lets npm attest that
      # this tarball was built by this workflow from this commit.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pin: newer Bun has emitted a bare `export {…}` root barrel with no
          # implementations when bundling this package (broke a1sheet@0.3.0).
          bun-version: 1.3.9

      # npm, not bun, does the publishing — provenance is an npm CLI feature.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun test

      - name: Refuse to publish a version that does not match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./packages/a1sheet/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $pkg" >&2
            exit 1
          fi

      # A tag pushed for a version already on the registry is not a failure —
      # it happens whenever a release was published by hand — and a permanently
      # red release history is worse than a skipped step.
      - id: published
        run: |
          v=$(node -p "require('./packages/a1sheet/package.json').version")
          if npm view "a1sheet@$v" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::a1sheet@$v is already on npm; nothing to publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.published.outputs.already == 'false'
        run: npm publish --provenance --access public
        working-directory: packages/a1sheet
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
